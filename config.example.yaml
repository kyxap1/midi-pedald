# midi-pedald configuration. Re-point a footswitch by editing rules here, not code.

midi:
  # Substring match against the MIDI input name (case-insensitive). The port
  # can be renamed by macOS between reboots, so match on something stable.
  # Find yours with:  python -m midi_pedald --monitor
  port_substring: "Scarlett"

# One block per sink. A sink absent here is disabled; a rule naming a sink with
# no block here is a config error.
sinks:
  obs: {}              # port and password are read from OBS's own obs-websocket
                       # config at connect time; set host/port/password here only
                       # to override (e.g. OBS on another machine)
  midi_out:
    port_substring: "IAC"   # the output device CC sequences are sent to (create IAC Driver Bus 1
                            # in Audio MIDI Setup); learn these CCs on the Waveform side

bpm:
  enabled: true
  window_ticks: 96       # 96 = one 4/4 bar
  tolerance: 1.5         # BPM dead-band: the latch ignores drift smaller than this
  confirm_windows: 2     # a new tempo must hold this many windows before the latch moves

logging:
  level: INFO           # DEBUG logs every MIDI event and the rule decision
  file: "~/Library/Logs/midi-pedald/midi-pedald.log"
  max_bytes: 1048576    # rotate at 1 MiB
  backup_count: 3

# event -> action. EVERY matching rule fires, in file order. debounce_ms
# defaults to 300 and is tracked per rule.
#
# events:  start | stop | continue | program_change | control_change
#   program_change:  number: N   or   range: [lo, hi]     (raw 0-127 wire values)
#   control_change:  number: N   and/or   value_range: [lo, hi]
# action:  "<sink>.<method>"
#   obs:       start_record | stop_record | toggle_record | split_record_file
#              save_replay_buffer | start_replay_buffer | stop_replay_buffer
#   midi_out:  cc_sequence   params: { cc: [[num, val], ...], gap_ms: N }
#
# Put obs rules above midi_out rules: a cc_sequence gap_ms blocks the dispatch
# loop for its duration, so OBS should fire first.
#
# RC-5 sends Start (0xFA) when a loop starts recording/playing and Stop (0xFC)
# when it stops. Each start_record/stop_record pair is already a separate file.
# CC 20 = record, 21 = stop, 22 = rewind — arbitrary, learned on the Waveform side.
rules:
  - event: start
    action: obs.start_record
    debounce_ms: 500
  - event: start
    action: midi_out.cc_sequence
    debounce_ms: 500
    params: { cc: [[22, 127], [20, 127]], gap_ms: 50 }

  - event: stop
    action: obs.stop_record
    debounce_ms: 500
  - event: stop
    action: midi_out.cc_sequence
    debounce_ms: 500
    params: { cc: [[21, 127], [22, 127]], gap_ms: 50 }

  # Optional: use a memory change to cut a new file mid-recording.
  # Needs OBS Studio 30.2+ (obs-websocket 5.5.0); otherwise it logs an error.
  - event: program_change
    range: [0, 127]
    action: obs.split_record_file
    debounce_ms: 500
